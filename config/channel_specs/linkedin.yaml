# LinkedIn platform constraints.

key: linkedin
name: LinkedIn
max_characters: 3000
supports_hashtags: true
max_hashtags: 3
supports_links: true
preferred_kinds:
  - social_post
format_notes:
  - The first 3 lines appear before "see more" -- the argument must open there.
  - Professional register; the audience here includes prospective clients.
  - Short paragraphs, generous line breaks.
  - Links in the post body are down-ranked; prefer naming the source and adding
    the URL in the first comment.
  - Close with a question only when it is a real one.
