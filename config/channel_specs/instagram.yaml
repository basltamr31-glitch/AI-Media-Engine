# Instagram platform constraints. Not tenant-scoped: these are facts about the
# platform, shared by every workspace.

key: instagram
name: Instagram
max_characters: 2200
supports_hashtags: true
max_hashtags: 12          # platform allows 30; 8-12 performs better and looks less spammy
supports_links: false     # no clickable links in captions -- affects how sources are cited
preferred_kinds:
  - caption
  - hashtags
  - reel_script
  - image_prompt
format_notes:
  - The first 125 characters are visible before "more" -- the hook must land there.
  - No clickable links; refer to "link in bio" and name the source explicitly.
  - Line breaks between short paragraphs; dense blocks lose readers.
  - Arabic captions render right-to-left; avoid mixed-direction runs mid-sentence.
