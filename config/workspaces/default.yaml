editorial:
  max_stories_per_run: 3
  minimum_score: 0.35
  recency_half_life_hours: 24
  # Enforces "newsletters are tips, not text". Disabling this would turn the
  # product into a republisher: a legal risk and a commodity.
  require_primary_source: true
  # Signal weights. Keys must be ranking signals the active pack declares
  # (ADR 0016). Omit this block entirely to inherit the pack's defaults --
  # which is what these values happen to be, spelled out here as an example.
  scoring:
    weights:
      corroboration: 0.30
      source_authority: 0.20
      recency: 0.20
      prominence: 0.15
      audience_fit: 0.15
  priority_topics:
    - foundation models
    - AI agents
    - developer tooling
    - AI policy and regulation
    - applied AI in business
  blocked_topics:
    - crypto price speculation
    - celebrity gossip

brand_profiles:
  - default_ar
  - default_en

meta:
  strategy: media-first
  notes: House channel. Customer workspaces are added as sibling files.
