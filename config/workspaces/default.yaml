# Workspace definition -- the tenant, its sources and its editorial policy.
#
# This file is the source of truth. `engine workspace seed` reconciles the
# database with it, idempotently. Adding a customer later means adding a file
# here, not writing code.

slug: default
name: AI Media Engine (house channel)

# Domain pack: supplies the taxonomy and vocabulary. Swapping this line for
# another pack changes what subject the engine is about, with no code change.
pack: ai-news
timezone: Asia/Riyadh
languages:
  - ar
  - en

# Three sources from day one, deliberately. A single source means inheriting
# someone else's editorial bias, always being a day late, and dying when they
# change format. Three different *transports* also stress-test the adapter
# abstraction properly rather than in theory.
sources:
  # Newsletter: a tip sheet. Tells us what to look at, never what to publish.
  #
  # `config` reaches both the fetcher and the parser, so a second newsletter of
  # the same format that names its ad sections differently is a config edit
  # rather than a code change. See docs/PARSING.md.
  - kind: email
    name: TLDR AI
    identifier: dan@tldrnewsletter.com
    parser_key: tldr_newsletter
    trust_weight: 0.60
    config:
      # Whole sections dropped by heading. Individually marked "(Sponsor)"
      # items are removed by the parser regardless of this list.
      strip_sections:
        - sponsor
        - advertisement
        - together with

  # Community signal: velocity and attention, legally unambiguous public API.
  #
  # Note the shape of `config` below. The JSON fetcher knows nothing about
  # Hacker News -- `items_path` tells it where the array lives, `field_map`
  # tells it which keys to read, `filters` tells it what to discard. Adding
  # any other JSON source is the same four keys with different values.
  - kind: api
    name: Hacker News (front page)
    identifier: https://hn.algolia.com/api/v1/search
    parser_key: hackernews_api
    trust_weight: 0.45
    config:
      items_path: hits
      max_items: 50
      request:
        params:
          tags: front_page
          hitsPerPage: 50
      field_map:
        external_id: objectID
        title: title
        url: url
        author: author
        published_at: created_at
        summary: story_text
      filters:
        # Attention floor. Below this, a front-page slot is noise.
        min:
          points: 100
        require:
          - title

  # Primary source by definition: research, straight from the authors.
  - kind: rss
    name: arXiv cs.AI
    identifier: https://export.arxiv.org/rss/cs.AI
    parser_key: arxiv_rss
    trust_weight: 0.75
    config:
      max_items: 40
      # What this source's links are worth in the provenance ledger. Declared
      # rather than inferred: a URL cannot tell the engine whether a page is
      # the authors' own announcement or somebody's report of it.
      evidence_kind: primary

