[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-media-engine"
version = "0.1.0"
description = "AI-powered media engine: multi-source ingestion, editorial ranking, and multi-channel content generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "AI Media Engine" }]
keywords = ["ai", "agent", "content", "media", "pipeline", "editorial"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# Runtime dependencies through Phase 1 (ingestion). Still nothing that talks to
# an LLM: generation arrives in Phase 3 and stays behind the `llm` extra until then.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
    "structlog>=24.4,<26",
    "pyyaml>=6.0,<7",
    # --- Phase 1: ingestion transports ---
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
    "google-api-python-client>=2.150,<3",
    "google-auth-oauthlib>=1.2,<2",
    # --- Phase 2: parsing ---
    # Newsletter bodies are machine-generated email HTML. Hand-rolling a
    # tolerant reader for that is exactly the code that rots.
    "beautifulsoup4>=4.12,<5",
    # --- Phase 2: primary-source extraction ---
    # Separating an article from its navigation, consent banner and comment
    # thread is a solved problem; a home-grown version of it decays as the
    # web changes. Required rather than optional: without it the engine can
    # only republish what newsletters said, which is the one thing it must not do.
    "trafilatura>=1.12,<3",
    "lxml>=5.3,<7",
]

# Optional extras map 1:1 onto roadmap phases. They are declared but NOT installed,
# so the dependency graph itself documents the plan and prevents accidental early use.
[project.optional-dependencies]
llm = ["anthropic>=0.40,<1"]                                    # Phase 3 - generation
postgres = ["psycopg[binary]>=3.2,<4"]                           # Phase 6+ - multi-tenant storage
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]        # Phase 7+ - SaaS surface
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
engine = "engine.cli.main:app"

# The engine's own fetchers are plugins (ADR 0017). They are discovered through
# exactly the mechanism a third-party package would use, so the extension path
# is exercised on every run and cannot rot. Each value is a factory taking a
# PluginContext; the name is the registry key.
#
# NOTE: entry points are baked into the installed metadata. After editing this
# block, re-run `pip install -e . --no-deps` or the change is invisible.
[project.entry-points."engine.fetchers"]
email = "engine.adapters.sources.email.gmail:build_fetcher"
rss = "engine.adapters.sources.rss:build_fetcher"
api = "engine.adapters.sources.json_api:build_fetcher"

[project.entry-points."engine.parsers"]
tldr_newsletter = "engine.adapters.parsers.tldr:build_parser"
arxiv_rss = "engine.adapters.parsers.arxiv:build_parser"
hackernews_api = "engine.adapters.parsers.hackernews:build_parser"

# One computer per ranking signal the ai-news pack declares. A vertical
# ranking on CVSS severity or trial phase ships its own beside its pack.
[project.entry-points."engine.signals"]
corroboration = "engine.adapters.scoring.computers:build_corroboration"
source_authority = "engine.adapters.scoring.computers:build_source_authority"
recency = "engine.adapters.scoring.computers:build_recency"
prominence = "engine.adapters.scoring.computers:build_prominence"
audience_fit = "engine.adapters.scoring.computers:build_audience_fit"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes are a correctness bug in a scheduled pipeline
    "T20",       # no stray print()
    "SIM",       # simplification
    "PTH",       # pathlib over os.path
    "RUF",
    "ANN",       # require annotations
    "S",         # bandit security rules
]
ignore = [
    "ANN401",    # Any is legitimate in JSON-shaped metadata fields
    "B008",      # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
# RUF001: test fixtures are Arabic prose, and the confusable-character rule
# flags every alef as a possible Latin "l". Real in identifiers, noise in a
# paragraph -- and a noqa on every Arabic string would only teach people to
# add them reflexively. The rule stays on in src/, where a confusable in an
# identifier would actually matter.
"tests/**" = ["S101", "ANN", "DTZ", "RUF001"]
"migrations/**" = ["ANN", "N", "T20", "I"]
"src/engine/cli/**" = ["T20"]
# Developer scripts talk to a terminal and to CI logs; printing is the
# interface, not a leftover debug statement.
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Test functions are exempt from return annotations: `-> None` on several hundred
# test cases is noise, not safety. Everything they *call* is still fully checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "engine.cli.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Google's client libraries and feedparser ship no type information. The
# untyped surface is confined to the adapter modules that wrap them; every
# value crossing back into the engine is typed at that boundary.
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "feedparser.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: exercises the database or filesystem",
]

[tool.coverage.run]
source = ["src/engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Set just below the measured 88% at the end of Phase 6. A floor above the
# current number fails immediately and gets lowered; a floor far below it never
# fires. Three points of slack absorbs an honest refactor and still catches a
# feature that arrives with no tests. Raise it when the real number moves, not
# in anticipation.
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
