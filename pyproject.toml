[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-media-engine"
version = "0.1.0"
description = "AI-powered media engine: multi-source ingestion, editorial ranking, and multi-channel content generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "AI Media Engine" }]
keywords = ["ai", "agent", "content", "media", "pipeline", "editorial"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# Runtime dependencies through Phase 1 (ingestion). Still nothing that talks to
# an LLM: generation arrives in Phase 3 and stays behind the `llm` extra until then.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
    "structlog>=24.4,<26",
    "pyyaml>=6.0,<7",
    # --- Phase 1: ingestion transports ---
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
    "google-api-python-client>=2.150,<3",
    "google-auth-oauthlib>=1.2,<2",
]

# Optional extras map 1:1 onto roadmap phases. They are declared but NOT installed,
# so the dependency graph itself documents the plan and prevents accidental early use.
[project.optional-dependencies]
llm = ["anthropic>=0.40,<1"]                                    # Phase 3 - generation
enrichment = [                                                   # Phase 2 - primary-source extraction
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<7",
    "trafilatura>=1.12,<3",
]
postgres = ["psycopg[binary]>=3.2,<4"]                           # Phase 6+ - multi-tenant storage
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]        # Phase 7+ - SaaS surface
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
engine = "engine.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes are a correctness bug in a scheduled pipeline
    "T20",       # no stray print()
    "SIM",       # simplification
    "PTH",       # pathlib over os.path
    "RUF",
    "ANN",       # require annotations
    "S",         # bandit security rules
]
ignore = [
    "ANN401",    # Any is legitimate in JSON-shaped metadata fields
    "B008",      # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "DTZ"]
"migrations/**" = ["ANN", "N", "T20", "I"]
"src/engine/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Test functions are exempt from return annotations: `-> None` on several hundred
# test cases is noise, not safety. Everything they *call* is still fully checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "engine.cli.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Google's client libraries and feedparser ship no type information. The
# untyped surface is confined to the adapter modules that wrap them; every
# value crossing back into the engine is typed at that boundary.
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "feedparser.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: exercises the database or filesystem",
]

[tool.coverage.run]
source = ["src/engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
