name: CI

# Every check that CLAUDE.md requires before work is called complete, run on
# every push. The point is not that these commands exist -- they already did --
# but that nobody can forget one, and that a green branch means the same thing
# to a reviewer as it does to the author.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first: reviewing a run of a commit that has
  # already been replaced wastes both CI minutes and attention.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite must not depend on a developer's .env, and a missing key should
  # fail loudly rather than silently selecting a different provider.
  ENGINE_ENVIRONMENT: test
  ENGINE_LOG_FORMAT: json
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Includes the `llm` extra so the Anthropic adapter is type-checked and
      # its tests actually run. Without it that module is skipped, and an
      # optional provider nobody checks is one that breaks unnoticed.
      - name: Install
        run: pip install -e ".[llm,dev]"

      - name: Format
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy

      # The architecture is only enforced if this runs. Without it the layer
      # boundaries are a diagram in a document rather than a property of the
      # code, and they rot in the direction of whatever was quickest.
      - name: Layer contracts
        run: lint-imports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[llm,dev]"

      # No network and no model. Every fetcher and the LLM port are behind
      # fakes, so a suite that suddenly needs egress has acquired a dependency
      # by accident and should fail here rather than in a month.
      #
      # Without coverage: the suite runs in about four minutes bare and about
      # thirty-two under branch-coverage tracing. Paying that on every push
      # would make CI something people work around instead of wait for, so the
      # floor is enforced once per pull request in the job below.
      - name: Tests
        run: pytest

  coverage:
    name: Coverage floor
    # Pull requests only, for the reason above. `workflow_dispatch` so the
    # number can be checked on demand without opening one.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[llm,dev]"

      # `fail_under` lives in pyproject.toml, so the threshold is the same
      # number locally and here. A floor that only exists in CI is one nobody
      # can check before pushing.
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  migrations:
    name: Migrations apply and match the models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[llm,dev]"

      - name: Upgrade to head
        run: engine db upgrade

      # The check that catches the mistake nobody notices: a model changed and
      # the migration was not written. Autogenerate against an up-to-date
      # database must produce nothing.
      - name: No model drift
        run: python scripts/check_migration_drift.py

  evals:
    name: Golden-set quality floor
    # Needs a real model, which a hosted runner does not have. Ollama would be
    # a multi-gigabyte pull on every run and the hosted models cost money per
    # invocation, so this job only runs where a self-hosted runner with the
    # model already resident is available -- and is skipped, visibly, otherwise.
    #
    # Stating that plainly matters more than the job: the alternative is a
    # workflow that appears to enforce quality and does not. The threshold is
    # real and enforced by `engine eval run --min-score`; where it runs is an
    # infrastructure fact, not a claim about the code.
    if: vars.HAS_MODEL_RUNNER == 'true'
    runs-on: [self-hosted, ollama]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[llm,dev]"

      # Median of three: generation is not deterministic, and a single sample
      # has been observed to swing from 0.55 to 0.98 on one unchanged case.
      # A gate that fires on sampling noise is a gate people disable.
      - name: Evals
        run: engine eval run --repeat 3 --min-score 0.85
