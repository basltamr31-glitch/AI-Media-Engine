# Alembic configuration.
#
# Note: sqlalchemy.url is deliberately left blank. The URL is resolved at runtime
# from application settings (migrations/env.py), so migrations and the app can
# never disagree about which database they are pointing at.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

# Timestamped, descriptive revision filenames keep the history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
